<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>EarVault 耳钉洞藏</title>
<style>
:root{
  --bg:#0f0f23;--bg2:#16162a;--bg3:#1a1a3e;--card:rgba(255,255,255,.04);
  --primary:#e94560;--secondary:#ff6b9d;--accent:#7c4dff;
  --rarity-common:#aaa;--rarity-rare:#4fc3f7;--rarity-epic:#ab47bc;--rarity-legendary:#ffab00;
  --text:#fff;--text2:#aaa;--text3:#666;
  --radius-sm:12rpx;--radius-md:16rpx;--radius-lg:20rpx;--radius-xl:24rpx;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
.container{max-width:500px;margin:0 auto;padding:20px 16px 80px}
/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:24px}
.logo-area{display:flex;align-items:center;gap:8px}
.logo-icon{font-size:28px;color:var(--primary)}
.logo-text{font-size:24px;font-weight:bold;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:13px;color:var(--text3);margin-left:4px}
.nav-wish{position:relative;font-size:28px;cursor:pointer}
.wish-badge{position:absolute;top:-4px;right:-4px;background:var(--primary);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}

/* Hero */
.hero{position:relative;text-align:center;padding:30px 0;overflow:hidden;margin-bottom:24px}
.hero-bg .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35}
.hero-bg .g1{width:200px;height:200px;background:var(--primary);top:-30px;right:-30px}
.hero-bg .g2{width:140px;height:140px;background:var(--accent);bottom:10px;left:-20px}
.hero-bg .g3{width:100px;height:100px;background:#00bcd4;top:40%;left:30%}
.hero-title{font-size:42px;font-weight:bold;letter-spacing:6px;position:relative;z-index:1}
.hero-sub{font-size:16px;color:var(--text2);margin-top:8px;position:relative;z-index:1}

/* Gacha Card */
.gacha-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-xl);padding:28px;backdrop-filter:blur(10px);position:relative;z-index:1;margin-bottom:24px}
.gacha-ready,.gacha-done{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;margin-bottom:20px}
.pulse-dot{width:10px;height:10px;background:#4caf50;border-radius:50%;animation:pulse 1.5s infinite}
.check-icon{width:22px;height:22px;line-height:22px;text-align:center;background:rgba(76,175,80,.2);color:#4caf50;border-radius:50%;font-size:12px}
.gacha-btn{width:100%;height:56px;border-radius:28px;font-size:20px;font-weight:bold;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 6px 24px rgba(233,69,96,.4);transition:transform .1s}
.btn-primary:active{transform:scale(.97)}
.btn-disabled{background:rgba(255,255,255,.06);color:#555;cursor:not-allowed}

/* Stats */
.stats{display:flex;justify-content:space-around;padding:20px;background:var(--card);border-radius:var(--radius-lg);margin-bottom:24px}
.stat-item{text-align:center;cursor:pointer}
.stat-num{display:block;font-size:28px;font-weight:bold}
.stat-label{font-size:13px;color:var(--text3);margin-top:2px}
.stat-divider{width:1px;height:40px;background:rgba(255,255,255,.1)}

/* Quick Entry */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.entry{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0;background:var(--card);border-radius:var(--radius-md);cursor:pointer;transition:transform .1s;border:none;color:var(--text);font-size:13px}
.entry:active{transform:scale(.95)}
.entry-icon{width:48px;height:48px;line-height:48px;text-align:center;font-size:22px;border-radius:50%}
.entry-icon.ear{background:rgba(233,69,96,.15)}
.entry-icon.cal{background:rgba(33,150,243,.15)}
.entry-icon.wish{background:rgba(255,171,0,.15)}
.entry-icon.coll{background:rgba(171,71,188,.15)}

/* Section */
.section{margin-bottom:24px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title{font-size:20px;font-weight:bold}
.section-more{font-size:14px;color:var(--text2);cursor:pointer;background:none;border:none;color:var(--text2)}

/* Recent Card */
.recent-card{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--radius-lg);background:var(--card);border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
.recent-img{width:70px;height:70px;border-radius:50%;object-fit:contain;background:rgba(0,0,0,.2)}
.recent-info{flex:1}
.recent-name{display:block;font-size:20px;font-weight:bold;margin-bottom:4px}
.recent-rarity{font-size:15px}
.recent-glow{position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;filter:blur(30px);opacity:.4}
.glow-common{background:var(--rarity-common)}.glow-rare{background:var(--rarity-rare)}
.glow-epic{background:var(--rarity-epic)}.glow-legendary{background:var(--rarity-legendary)}

/* Page Section */
.page-section{display:none}
.page-section.active{display:block}

/* ===== GACHA PAGE ===== */
.gacha-machine{text-align:center;padding:30px 0;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mystery-box{width:220px;height:200px;position:relative;cursor:pointer}
.mystery-box.shake{animation:boxShake .3s ease-in-out}
.mystery-box.super-shake{animation:superShake .15s ease-in-out infinite}
.box-body{width:200px;height:170px;background:linear-gradient(145deg,var(--primary),#c62828);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0 auto;box-shadow:0 14px 40px rgba(233,69,96,.4),inset 0 2px 0 rgba(255,255,255,.2)}
.box-emoji{font-size:56px}
.box-text{font-size:16px;color:rgba(255,255,255,.8)}
.ribbon-h{position:absolute;width:100%;height:20px;background:#ffd54f;top:75px}
.ribbon-v{position:absolute;width:20px;height:170px;background:#ffd54f;left:100px;top:15px}
.box-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(233,69,96,.3),transparent 70%);animation:glowPulse 2s ease-in-out infinite}
.shake-text{font-size:18px;color:var(--text2);margin-top:20px;animation:blink .5s step-end infinite}

/* Result */
.result-reveal{text-align:center;animation:cardReveal .6s cubic-bezier(.34,1.56,.64,1) forwards}
.result-image{width:100px;height:100px;margin-bottom:16px;object-fit:contain}
.result-name{display:block;font-size:28px;font-weight:bold;margin-bottom:8px}
.result-rarity{display:inline-block;font-size:16px;padding:3px 16px;border-radius:14px;background:rgba(0,0,0,.2);margin-bottom:12px}
.result-desc{font-size:14px;color:#999;line-height:1.5}
.particles{position:absolute;inset:0;pointer-events:none}
.particle{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:currentColor;animation:particleExplode .8s ease-out forwards;opacity:0}
.result-actions{display:flex;gap:12px;margin:20px 0}
.action-btn{flex:1;height:48px;border-radius:24px;font-size:16px;border:none;cursor:pointer}
.btn-owned{background:rgba(76,175,80,.15);color:#81c784;border:1px solid rgba(76,175,80,.2)}
.btn-wanted{background:rgba(233,69,96,.1);color:var(--secondary);border:1px solid rgba(233,69,96,.2)}
.btn-outline{width:100%;height:48px;background:transparent;color:var(--text2);border:1px solid rgba(136,138,170,.2);border-radius:24px;font-size:16px;cursor:pointer;margin-top:8px}
.no-draw{text-align:center;padding:40px 0}
.no-draw-icon{font-size:48px}
.no-draw-text{display:block;font-size:20px;margin-top:12px;color:#ccc}
.no-draw-sub{display:block;font-size:15px;margin-top:6px;color:var(--text3)}
.wish-hint{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;padding:8px 16px;background:rgba(255,215,0,.06);border-radius:14px;font-size:14px}
.wish-hint .wish-icon{font-size:18px}
.wish-hint .wish-text{color:#ffc107}
.history-preview{margin-top:24px}
.history-preview .preview-title{display:block;font-size:16px;color:var(--text2);margin-bottom:12px}
.history-scroll{overflow-x:auto;white-space:nowrap;padding-bottom:8px}
.history-scroll::-webkit-scrollbar{height:0}
.history-list{display:inline-flex;gap:10px}
.history-item{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid transparent;flex-shrink:0;background:rgba(255,255,255,.04)}
.history-item.hist-common{border-color:rgba(170,170,170,.3)}
.history-item.hist-rare{border-color:rgba(79,195,247,.4)}
.history-item.hist-epic{border-color:rgba(171,71,188,.4)}
.history-item.hist-legendary{border-color:rgba(255,171,0,.5)}
.history-item img{width:100%;height:100%;object-fit:contain}

/* ===== COLLECTION PAGE ===== */
.filter-tabs{display:flex;gap:12px;margin-bottom:16px}
.filter-tab{padding:5px 14px;border-radius:14px;font-size:14px;color:var(--text3);cursor:pointer;background:rgba(255,255,255,.03)}
.filter-tab.active{color:var(--primary);background:rgba(233,69,96,.1)}
.filter-chips{overflow-x:auto;white-space:nowrap;margin-bottom:16px;padding-bottom:4px}
.filter-chips::-webkit-scrollbar{height:0}
.chip-list{display:inline-flex;gap:8px}
.filter-chip{padding:5px 16px;border-radius:14px;font-size:13px;color:var(--text2);cursor:pointer;background:var(--card);flex-shrink:0}
.filter-chip.active{color:#fff;background:rgba(233,69,96,.2)}
.collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.collection-item{background:var(--card);border-radius:var(--radius-md);padding:14px;text-align:center;border:1px solid transparent;cursor:pointer;transition:transform .1s}
.collection-item:active{transform:scale(.95)}
.collection-item.rarity-common{border-color:rgba(170,170,170,.1)}
.collection-item.rarity-rare{border-color:rgba(79,195,247,.15)}
.collection-item.rarity-epic{border-color:rgba(171,71,188,.15)}
.collection-item.rarity-legendary{border-color:rgba(255,171,0,.25)}
.item-img-wrap{position:relative;width:90px;height:90px;margin:0 auto 8px;border-radius:50%;background:rgba(0,0,0,.15);overflow:hidden}
.item-img-wrap img{width:100%;height:100%;object-fit:contain}
.status-tag{position:absolute;bottom:0;right:0;width:24px;height:24px;line-height:24px;text-align:center;font-size:11px;border-radius:50%}
.status-tag.owned{background:rgba(76,175,80,.85)}
.status-tag.wanted{background:rgba(233,69,96,.85)}
.status-tag.hidden{display:none}
.item-name{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-rarity{font-size:12px}
.empty-state{grid-column:span 3;text-align:center;padding:60px 0}
.empty-icon{font-size:56px}
.empty-text{display:block;font-size:18px;color:var(--text2);margin-top:12px}
.empty-sub{display:block;font-size:14px;color:var(--text3);margin-top:4px}

/* Detail Modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-popup{width:100%;max-height:85vh;border-radius:24px 24px 0 0;background:var(--bg3);overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
.modal-header{padding:40px 30px 30px;text-align:center}
.modal-header img{width:120px;height:120px}
.modal-body{padding:20px 30px 50px}
.modal-name{display:block;font-size:26px;font-weight:bold;text-align:center;margin-bottom:12px}
.modal-meta{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.meta-tag{font-size:14px;padding:3px 12px;border-radius:12px;border:1px solid #444;color:var(--text2)}
.modal-desc{display:block;font-size:16px;color:var(--text2);text-align:center;line-height:1.6;margin-bottom:24px}
.modal-actions{display:flex;gap:12px;margin-bottom:16px}
.modal-actions button{flex:1;height:48px;border-radius:16px;font-size:16px;border:none;cursor:pointer}
.btn-remove{width:100%;height:44px;background:transparent;color:var(--text3);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-size:15px;cursor:pointer}

/* ===== EAR MAP PAGE ===== */
.ear-stage{display:flex;align-items:center;justify-content:space-around;padding:20px 0;min-height:420px}
.ear-col{position:relative;width:150px;text-align:center}
.ear-col .ear-label{display:block;font-size:15px;color:var(--text2);margin-top:6px}
.ear-img-wrap{position:relative;width:150px;height:auto;cursor:pointer;display:inline-block}
.ear-img{width:100%;height:auto;border-radius:12px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.25))}
.ear-img.mirror{transform:scaleX(-1)}
.hole-dot{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:#4caf50;transform:translate(-50%,-50%);transition:all .2s;z-index:5;cursor:pointer}
.hole-earring{position:absolute;width:32px;height:32px;border-radius:50%;border:2px solid #e94560;background:rgba(233,69,96,.15);transform:translate(-50%,-50%);z-index:6;cursor:pointer;overflow:hidden;box-shadow:0 0 10px rgba(233,69,96,.3);transition:all .2s}
.hole-earring:hover{transform:translate(-50%,-50%) scale(1.15);z-index:10}
.hole-earring-img{width:100%;height:100%;object-fit:contain}
.center-ctrl{text-align:center}
.center-ctrl .side-label{display:block;font-size:18px;color:var(--text2);margin-bottom:4px}
.center-ctrl .hole-count{display:block;font-size:28px;font-weight:bold;color:var(--primary);margin-bottom:16px}
.btn-add-hole{height:44px;padding:0 24px;border-radius:22px;font-size:15px;background:linear-gradient(135deg,var(--accent),#b388ff);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(124,77,255,.3)}
.equipped-row{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.equip-dot{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--primary);background:rgba(233,69,96,.15);cursor:pointer}
.equip-dot img{width:100%;height:100%;object-fit:contain}
.hole-detail-section{margin-top:24px}
.hole-scroll{overflow-x:auto;white-space:nowrap;padding-bottom:8px}
.hole-scroll::-webkit-scrollbar{height:0}
.hole-card-list{display:inline-flex;gap:16px}
.hole-card{flex-shrink:0;width:260px;background:var(--card);border-radius:var(--radius-lg);padding:16px;border:1px solid rgba(255,255,255,.05)}
.hole-name{display:block;font-size:17px;font-weight:bold;margin-bottom:2px}
.hole-date{display:block;font-size:12px;color:var(--text3);margin-bottom:6px}
.healing-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:8px;margin-bottom:8px}
.hole-actions-row{display:flex;gap:8px;margin-top:8px}
.hole-act-btn{flex:1;height:36px;border-radius:10px;font-size:13px;border:none;cursor:pointer}
.hole-act-btn.equip{background:rgba(76,175,80,.12);color:#81c784}
.hole-act-btn.remove{background:rgba(233,69,96,.06);color:#ff8a80}
.current-equip{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.current-equip img{width:36px;height:36px;border-radius:50%}
.unequip-btn{font-size:12px;color:var(--primary);cursor:pointer;padding:3px 10px;background:rgba(233,69,96,.08);border-radius:6px}
.no-holes-tip{padding:20px;text-align:center;color:var(--text3);font-size:15px}

/* Position Picker */
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.pos-item{padding:12px;text-align:center;background:var(--card);border-radius:12px;border:1px solid transparent;cursor:pointer}
.pos-item.selected{border-color:var(--accent);background:rgba(124,77,255,.12)}
.pos-item .pos-icon{display:block;font-size:18px;margin-bottom:2px}
.pos-item .pos-name{font-size:12px;color:var(--text2)}

/* Earring Selector */
.earring-selector{max-height:350px;overflow-y:auto;margin-bottom:16px}
.earring-selector::-webkit-scrollbar{width:3px}
.earring-selector::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.selector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.selectable-earring{text-align:center;padding:10px;border-radius:10px;border:1px solid transparent;background:var(--card);cursor:pointer}
.selectable-earring.selected{border-color:var(--accent);background:rgba(124,77,255,.12)}
.selectable-earring img{width:44px;height:44px;margin-bottom:2px;object-fit:contain}
.selectable-earring .sel-name{font-size:11px;color:#999;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== WISH POOL PAGE ===== */
.info-card{display:flex;gap:12px;padding:16px;background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.1);border-radius:var(--radius-md);margin-bottom:20px}
.info-icon{font-size:30px}
.info-title{display:block;font-size:16px;font-weight:bold;color:#ffc107;margin-bottom:4px}
.info-desc{font-size:13px;color:#aa9944;line-height:1.5}
.upload-area{padding:50px 0;border:2px dashed rgba(255,215,0,.2);border-radius:var(--radius-lg);text-align:center;background:rgba(255,215,0,.02);cursor:pointer;margin-bottom:20px}
.upload-icon{font-size:40px}
.upload-text{display:block;font-size:17px;color:#ccc;margin-top:10px}
.upload-hint{display:block;font-size:13px;color:var(--text3);margin-top:4px}
.wish-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.wish-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.wish-item img{width:100%;height:100%;object-fit:cover}
.wish-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:8px;display:flex;justify-content:space-between;align-items:flex-end}
.wish-tag{font-size:10px;padding:2px 8px;background:rgba(124,77,255,.8);border-radius:6px}
.wish-del{width:24px;height:24px;line-height:24px;text-align:center;background:rgba(239,83,80,.8);border-radius:50%;font-size:11px;cursor:pointer}
.bonus-preview{padding:16px;background:var(--card);border-radius:var(--radius-md)}
.bonus-title{display:block;font-size:16px;font-weight:bold;margin-bottom:12px}
.bonus-tags{display:flex;flex-wrap:wrap;gap:8px}
.bonus-tag{display:flex;align-items:center;gap:4px;padding:5px 12px;background:rgba(124,77,255,.08);border-radius:14px;font-size:13px}
.bonus-tag .tag-bonus{color:#b388ff;font-weight:bold}

/* ===== CALENDAR PAGE ===== */
.month-switcher{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:16px}
.switch-btn{width:40px;height:40px;line-height:40px;text-align:center;font-size:22px;color:var(--text2);background:var(--card);border-radius:50%;cursor:pointer;border:none}
.month-display{font-size:20px;font-weight:bold}
.calendar-grid{background:var(--card);border-radius:var(--radius-lg);padding:16px;margin-bottom:20px}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px}
.weekday-cell{text-align:center;font-size:13px;color:var(--text3);padding:6px 0}
.date-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.date-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;position:relative;font-size:15px}
.date-cell.other-month{color:#333}
.date-cell.is-selected{background:rgba(124,77,255,.2)}
.date-cell.today{background:rgba(233,69,96,.12)}
.date-cell.today .date-num{color:var(--primary);font-weight:bold}
.record-dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.date-detail{padding:20px;background:var(--card);border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,.05);margin-bottom:20px}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.detail-date{font-size:20px;font-weight:bold}
.detail-dayofweek{font-size:15px;color:var(--text2)}
.record-card{padding:14px;background:rgba(0,0,0,.1);border-radius:10px;margin-bottom:8px}
.record-note{display:block;font-size:16px;line-height:1.5}
.record-time{display:block;font-size:12px;color:var(--text3);margin-top:4px}
.add-record-btn,.add-more-btn{width:100%;height:44px;border-radius:22px;font-size:15px;background:linear-gradient(135deg,var(--accent),#b388ff);color:#fff;border:none;cursor:pointer;margin-top:12px}
.healing-overview{margin-bottom:40px}
.overview-title{display:block;font-size:20px;font-weight:bold;margin-bottom:16px}
.timeline-list{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.timeline-list::-webkit-scrollbar{height:0}
.timeline-item{flex-shrink:0;width:200px;background:var(--card);border-radius:var(--radius-md);padding:16px;border-left:3px solid #555}
.timeline-dot{width:12px;height:12px;border-radius:50%;margin-bottom:10px}
.timeline-side{display:block;font-size:15px;font-weight:bold;margin-bottom:4px}
.timeline-days{font-size:26px;font-weight:bold}
.timeline-status{display:block;font-size:14px;font-weight:bold;margin-top:4px}
.timeline-tip{display:block;font-size:11px;color:var(--text3);margin-top:4px;line-height:1.4}

/* Input Modal */
.input-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.input-dialog{width:100%;background:var(--bg3);border-radius:24px 24px 0 0;padding:28px;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
.input-title{display:block;text-align:center;font-size:20px;font-weight:bold;margin-bottom:16px}
.input-textarea{width:100%;min-height:120px;padding:14px;background:rgba(255,255,255,.05);border-radius:12px;color:#fff;font-size:16px;border:1px solid rgba(255,255,255,.06);resize:none;font-family:inherit}
.input-actions{display:flex;gap:12px;margin-top:16px}
.input-actions button{flex:1;height:48px;border-radius:24px;font-size:16px;border:none;cursor:pointer}
.input-btn-cancel{background:rgba(255,255,255,.06);color:var(--text2)}
.input-btn-confirm{background:linear-gradient(135deg,var(--accent),#b388ff);color:#fff}
.input-btn-confirm:disabled{opacity:.4;cursor:not-allowed}

/* Dialog */
.dialog-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.dialog-content{width:90%;max-width:420px;max-height:80vh;background:var(--bg3);border-radius:20px;padding:28px;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1)}
.dialog-title{display:block;text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px}
.dialog-actions{display:flex;gap:12px;margin-top:20px}
.dialog-actions button{flex:1;height:48px;border-radius:16px;font-size:16px;border:none;cursor:pointer}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid rgba(255,255,255,.06);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer;border:none;background:none;color:var(--text2);font-size:11px}
.tab-item.active{color:var(--primary)}
.tab-item .tab-icon{font-size:22px}

/* Animations */
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
@keyframes boxShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes superShake{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-6px,4px) rotate(-8deg)}40%{transform:translate(4px,-6px) rotate(6deg)}60%{transform:translate(-4px,-3px) rotate(-4deg)}80%{transform:translate(3px,6px) rotate(8deg)}}
@keyframes glowPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.1)}}
@keyframes blink{50%{opacity:0}}
@keyframes cardReveal{from{transform:scale(.5) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes particleExplode{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}

// ==================== Storage ====================
function safeGet(k,d){try{const v=localStorage.getItem('ev_'+k);return v?JSON.parse(v):d}catch{return d}}
function safeSet(k,v){try{localStorage.setItem('ev_'+k,JSON.stringify(v))}catch{}}
function getCollection(){return safeGet('collection',[])}
function addToCollection(id,status){const c=getCollection();const e=c.find(i=>i.id===id);if(e)e.status=status;else c.push({id,status,addedAt:Date.now()});safeSet('collection',c);return c}
function removeFromCollection(id){const c=getCollection().filter(i=>i.id!==id);safeSet('collection',c);return c}
function canGachaToday(){const last=safeGet('lastDate','');const today=new Date().toISOString().split('T')[0];return last!==today}
function recordGacha(r){const h=safeGet('history',[]);h.unshift({...r,drawnAt:Date.now(),date:new Date().toISOString().split('T')[0]});if(h.length>100)h.length=100;safeSet('history',h);safeSet('lastDate',new Date().toISOString().split('T')[0]);return h}
function getGachaHistory(){return safeGet('history',[])}
function getWishPool(){return safeGet('wishes',[])}
function addToWishPool(w){const p=getWishPool();p.unshift({...w,addedAt:Date.now()});if(p.length>10)p.length=10;safeSet('wishes',p);return p}
function removeFromWish(idx){const p=getWishPool();p.splice(idx,1);safeSet('wishes',p);return p}
function getEarHoles(){return safeGet('holes',{left:[],right:[]})}
function addEarHole(side,pos){const h=getEarHoles();const n={id:side+'-'+Date.now(),side,position:pos,piercedAt:Date.now(),equippedEarring:null};h[side].push(n);safeSet('holes',h);return h}
function removeEarHole(side,id){const h=getEarHoles();h[side]=h[side].filter(ho=>ho.id!==id);safeSet('holes',h);return h}
function equipEarring(side,holeId,eId){const h=getEarHoles();const ho=h[side].find(x=>x.id===holeId);if(ho)ho.equippedEarring=eId;safeSet('holes',h);return h}
function getHealingRecords(){return safeGet('healing',{})}
function addHealingRecord(date,note){const r=getHealingRecords();if(!r[date])r[date]=[];r[date].push({note,time:new Date().toLocaleTimeString()});safeSet('healing',r);return r}
function daysSince(ts){return Math.floor((Date.now()-ts)/(86400000))}
function getHealingStage(days){if(days<7)return{stage:'fresh',label:'新打孔',color:'#ef5350',tips:'每天转动耳钉，保持清洁'};if(days<30)return{stage:'healing',label:'愈合中',color:'#ff9800',tips:'避免碰水，继续消毒护理'};if(days<90)return{stage:'stable',label:'基本稳定',color:'#4caf50',tips:'可以更换不同材质耳钉'};return{stage:'healed',label:'完全愈合',color:'#81c784',tips:'可以随意搭配各种耳饰啦！'}}
function weightedRandomDraw(pool){const tw=ALL_EARRINGS.reduce((s,e)=>s+e.weight,0);let r=Math.random()*tw;for(const e of ALL_EARRINGS){let w=e.weight;if(pool&&pool.includes(e.style))w*=1.3;r-=w;if(r<=0)return e}return ALL_EARRINGS[ALL_EARRINGS.length-1]}

// ==================== Vue App ====================
const {createApp,ref,reactive,computed,watch,onMounted,nextTick} = Vue;

const app = createApp({
  setup(){
    const page=ref('index');
    const gachaPhase=ref('idle'); // idle|shaking|revealed
    const gachaResult=ref(null);
    const canDraw=ref(true);
    const gachaHistory=ref([]);
    const collection=ref([]);
    const wishPool=ref([]);
    const holes=ref({left:[],right:[]});
    const detailItem=ref(null);
    const showAddHole=ref(false);
    const showEquip=ref(false);
    const selectedPos=ref('lobe');
    const addHoleSide=ref('left');
    const equipSide=ref(null);
    const equipHoleId=ref(null);
    const selectedEarringId=ref(null);
    const showRecordInput=ref(false);
    const newRecordNote=ref('');
    const selectedDate=ref(new Date().toISOString().split('T')[0]);
    const recordsData=ref({});
    const calendarYear=ref(new Date().getFullYear());
    const calendarMonth=ref(new Date().getMonth()+1);
    const activeTab=ref('all');
    const styleFilter=ref('');

    // ===== INDEX =====
    const ownedCount=computed(()=>getCollection().filter(c=>c.status==='owned').length);
    const historyTotal=computed(()=>getGachaHistory().length);
    const holeTotal=computed(()=>{const h=getEarHoles();return(h.left?.length||0)+(h.right?.length||0)});
    const recentEarring=computed(()=>{const h=getGachaHistory();return h.length?ALL_EARRINGS.find(e=>e.id===h[0].id):null});

    function refreshAll(){
      canDraw.value=canGachaToday();
      gachaHistory.value=getGachaHistory();
      collection.value=getCollection();
      wishPool.value=getWishPool();
      holes.value=getEarHoles();
      recordsData.value=getHealingRecords();
    }

    onMounted(refreshAll);

    // ===== GACHA =====
    async function startGacha(){
      if(!canDraw.value)return;
      gachaPhase.value='shaking';
      await sleep(600);
      if(navigator.vibrate)navigator.vibrate(200);
      await sleep(800);
      if(navigator.vibrate)navigator.vibrate(500);
      await sleep(600);
      const pool=[];
      gachaResult.value=weightedRandomDraw(pool);
      gachaHistory.value=recordGacha(gachaResult.value);
      canDraw.value=false;
      gachaPhase.value='revealed';
    }
    function markOwned(){
      if(gachaResult.value){collection.value=addToCollection(gachaResult.value.id,'owned');alert('已标记为拥有！')}
    }
    function markWanted(){
      if(gachaResult.value){collection.value=addToCollection(gachaResult.value.id,'wanted');alert('已加入想要清单！')}
    }

    // ===== COLLECTION =====
    const filteredCollection=computed(()=>{
      let list=ALL_EARRINGS.filter(e=>{
        if(activeTab.value==='owned'){
          const c=getCollection().find(i=>i.id===e.id);
          if(!c||c.status!=='owned')return false;
        }else if(activeTab.value==='wanted'){
          const c=getCollection().find(i=>i.id===e.id);
          if(!c||c.status!=='wanted')return false;
        }
        // 'all': 显示所有耳钉
        if(styleFilter.value&&e.style!==styleFilter.value)return false;
        return true;
      });
      return list;
    });
    function showDetail(item){detailItem.value=item}
    function toggleStatus(id,status){collection.value=addToCollection(id,status)}
    function removeColl(id){collection.value=removeFromCollection(id);detailItem.value=null}

    // ===== EAR MAP =====
    function onAddHole(side){
      addHoleSide.value=side;
      showAddHole.value=true;
    }
    function confirmAddHole(){
      // 预设位置已废弃，使用点击坐标
      if(clickedPos.value){
        holes.value=addEarHole(addHoleSide.value,{x:clickedPos.value.x,y:clickedPos.value.y,name:clickedPos.value.name,key:'custom'});
        clickedPos.value=null;
        showAddHole.value=false;
      }
    }
    const clickedPos=ref(null);
    function onEarClick(side,event){
      const wrap=event.currentTarget;
      const rect=wrap.getBoundingClientRect();
      const pctX=((event.clientX-rect.left)/rect.width*100).toFixed(1);
      const pctY=((event.clientY-rect.top)/rect.height*100).toFixed(1);
      const name=EAR_POSITIONS.reduce((best,p)=>{
        const dx=Math.abs(parseFloat(pctX)-p.x),dy=Math.abs(parseFloat(pctY)-p.y);
        const d=dx*dx+dy*dy;
        return d<best.d?{d,name:p.name}:best;
      },{d:Infinity,name:'自定义位置'}).name;
      clickedPos.value={x:parseFloat(pctX),y:parseFloat(pctY),name};
      addHoleSide.value=side;
      showAddHole.value=true;
    }
    function openEquipPanel(side,holeId){
      equipSide.value=side;equipHoleId.value=holeId;selectedEarringId.value=null;showEquip.value=true;
    }
    function confirmEquip(){
      if(selectedEarringId.value&&equipSide.value&&equipHoleId.value){
        holes.value=equipEarring(equipSide.value,equipHoleId.value,selectedEarringId.value);showEquip.value=false;
      }
    }
    function doUnequip(side,holeId){holes.value=equipEarring(side,holeId,null)}
    function removeHole(side,holeId){if(confirm('确定删除？')){holes.value=removeEarHole(side,holeId)}}

    // ===== WISH POOL =====
    function uploadWish(){
      const input=document.createElement('input');input.type='file';input.accept='image/*';
      input.onchange=(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        if(wishPool.value.length>=10){alert('最多10张许愿图');return}
        const reader=new FileReader();
        reader.onload=(ev)=>{
          const styles=Object.keys(STYLE_CONFIG);

        };
        reader.readAsDataURL(file);
      };
      input.click();
    }
    function removeWish(idx){if(confirm('移除？')){wishPool.value=removeFromWish(idx)}}
    const styleBonus=computed(()=>{const s={};wishPool.value.forEach(w=>{if(w.style)s[w.style]=(s[w.style]||0)+1});return s});

    // ===== CALENDAR =====
    const calendarCells=computed(()=>{
      const y=calendarYear.value,m=calendarMonth.value;
      const total=new Date(y,m,0).getDate(),firstD=new Date(y,m-1,1).getDay();
      const todayStr=new Date().toISOString().split('T')[0];
      const cells=[];
      const prevDays=new Date(y,m-1,0).getDate();
      for(let i=firstD-1;i>=0;i--){
        const d=prevDays-i;
        const ds=`${y}-${String(m-1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({day:d,dateStr:ds,currentMonth:false,isToday:false,hasRecord:!!recordsData.value[ds]});
      }
      for(let d=1;d<=total;d++){
        const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({day:d,dateStr:ds,currentMonth:true,isToday:ds===todayStr,hasRecord:!!recordsData.value[ds]});
      }
      const rem=42-cells.length;
      for(let i=1;i<=rem;i++){
        const nm=m+1>12?1:m+1,ny=nm===1?y+1:y;
        const ds=`${ny}-${String(nm).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        cells.push({day:i,dateStr:ds,currentMonth:false,isToday:false,hasRecord:!!recordsData.value[ds]});
      }
      return cells;
    });
    const selectedRecords=computed(()=>recordsData.value[selectedDate.value]||[]);
    const allHoles=computed(()=>[...(holes.value.left||[]),...(holes.value.right||[])]);
    function selectDateCell(cell){if(cell.dateStr)selectedDate.value=cell.dateStr}
    function prevMonth(){if(calendarMonth.value===1){calendarMonth.value=12;calendarYear.value--}else calendarMonth.value--}
    function nextMonth(){if(calendarMonth.value===12){calendarMonth.value=1;calendarYear.value++}else calendarMonth.value++}
    function saveRecord(){
      if(!newRecordNote.value.trim())return;
      recordsData.value=addHealingRecord(selectedDate.value,newRecordNote.value.trim());
      newRecordNote.value='';showRecordInput.value=false;
    }

    return {
      page,ALL_EARRINGS,RARITY_CONFIG,STYLE_CONFIG,EAR_POSITIONS,
      // Index
      ownedCount,historyTotal,holeTotal,recentEarring,canDraw,
      // Gacha
      gachaPhase,gachaResult,gachaHistory,startGacha,markOwned,markWanted,
      // Collection
      collection,activeTab,styleFilter,filteredCollection,showDetail,detailItem,toggleStatus,removeColl,
      // EarMap
      holes,showAddHole,addHoleSide,clickedPos,onEarClick,confirmAddHole,
      showEquip,selectedEarringId,openEquipPanel,confirmEquip,doUnequip,removeHole,
      // Wish
      wishPool,uploadWish,removeWish,styleBonus,
      // Calendar
      calendarYear,calendarMonth,calendarCells,selectedDate,selectedRecords,allHoles,
      selectDateCell,prevMonth,nextMonth,showRecordInput,newRecordNote,saveRecord,
      // Helpers
      daysSince,getHealingStage,
      formatDate(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
      getEarringImg(id){const e=ALL_EARRINGS.find(x=>x.id===id);return e?e.image:''},
      getPosName(pos){return pos.name||'('+Math.round(pos.x)+'%,'+Math.round(pos.y)+'%)'},
      getStatusText(id){const c=getCollection().find(i=>i.id===id);return c?c.status:''},
    };
  },

        <button class="input-btn-cancel" style="flex:1;height:48px;border-radius:16px;border:none;cursor:pointer;font-size:16px;background:rgba(255,255,255,.06);color:#aaa" @click="showEquip=false">取消</button>
        <button class="input-btn-confirm" style="flex:1;height:48px;border-radius:16px;border:none;cursor:pointer;font-size:16px" @click="confirmEquip" :disabled="!selectedEarringId">配戴</button>
      </div>
    </div>
  </div>

  <!-- ===== Record Input Modal ===== -->
  <div class="input-mask" v-if="showRecordInput" @click="showRecordInput=false">
    <div class="input-dialog" @click.stop>
      <span class="input-title">添加护理记录</span>
      <textarea class="input-textarea" v-model="newRecordNote" placeholder="例如：今天转了耳钉，用酒精消了毒..." maxlength="200"></textarea>
      <div class="input-actions">
        <button class="input-btn-cancel" @click="showRecordInput=false">取消</button>
        <button class="input-btn-confirm" @click="saveRecord" :disabled="!newRecordNote.trim()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== Tab Bar ===== -->
  <div class="tab-bar">
    <button class="tab-item" :class="{active:page==='index'}" @click="page='index'"><span class="tab-icon">🏠</span>首页</button>
    <button class="tab-item" :class="{active:page==='gacha'}" @click="page='gacha'"><span class="tab-icon">🎁</span>盲盒</button>
    <button class="tab-item" :class="{active:page==='collection'}" @click="page='collection'"><span class="tab-icon">💎</span>收藏</button>
    <button class="tab-item" :class="{active:page==='earmap'}" @click="page='earmap'"><span class="tab-icon">👂</span>规划</button>
  </div>
</div>`
});

app.mount('#app');
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
